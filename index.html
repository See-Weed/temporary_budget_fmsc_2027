<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#122846" />
    <meta
      name="description"
      content="FMSC Selangor 2027 committee, quotation and detailed budget comparison dashboard"
    />
    <title>FMSC Selangor 2027 | Committee budgets V3.2</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
      :root {
        font-family:
          Inter,
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        --ink: #1b2c41;
        --muted: #64748b;
        --navy: #102840;
        --blue: #2564a1;
        --pale: #eef4fa;
        --line: #dde5ed;
        --bg: #f3f6fa;
        --white: #fff;
        --orange: #b76a20;
        --green: #17664f;
        --red: #a84343;
        --shadow: 0 4px 22px #1028400b;
        color: var(--ink);
        background: var(--bg);
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      a {
        color: #145a97;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      summary:focus-visible {
        outline: 3px solid #68a4ea;
        outline-offset: 2px;
      }
      .top {
        background: linear-gradient(
          118deg,
          #102840 0%,
          #19496f 72%,
          #2f728b 100%
        );
        color: #fff;
      }
      .topinner {
        max-width: 1700px;
        margin: auto;
        padding: 26px 27px 22px;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 1.6px;
        font-weight: 800;
        text-transform: uppercase;
        color: #a9d5eb;
      }
      .brandrow {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
      }
      .brandrow h1 {
        font-size: clamp(22px, 2.5vw, 33px);
        margin: 4px 0 4px;
        line-height: 1.17;
        letter-spacing: -0.7px;
      }
      .brandrow p {
        margin: 0;
        color: #cbdcea;
        font-size: 13px;
        line-height: 1.6;
      }
      .headright {
        text-align: right;
        color: #c9e4f2;
        font-size: 12px;
        min-width: 180px;
      }
      .headright strong {
        display: block;
        color: #fff;
        font-size: 14px;
        margin-bottom: 4px;
      }
      .tabs {
        display: flex;
        gap: 6px;
        margin-top: 23px;
        overflow: auto;
        padding-bottom: 2px;
        scrollbar-width: thin;
      }
      .tabs button {
        background: transparent;
        border: 1px solid #ffffff20;
        color: #d6e9f3;
        padding: 10px 16px;
        white-space: nowrap;
        border-radius: 9px;
        font-size: 13px;
        font-weight: 700;
      }
      .tabs button:hover {
        background: #ffffff18;
      }
      .tabs button.active {
        background: #fff;
        color: #173e64;
        border-color: #fff;
      }
      .container {
        max-width: 1700px;
        margin: auto;
        padding: 22px 27px 52px;
        min-height: 70vh;
      }
      .panel {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 15px;
        box-shadow: var(--shadow);
        padding: 19px;
      }
      .panel.tight {
        padding: 14px;
      }
      .stack {
        display: grid;
        gap: 17px;
      }
      .grid {
        display: grid;
        gap: 14px;
      }
      .grid2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .grid3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .grid4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .grid5 {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
      .flex {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .flexbetween {
        display: flex;
        gap: 14px;
        align-items: center;
        justify-content: space-between;
      }
      .wrap {
        flex-wrap: wrap;
      }
      .slabel {
        font-size: 11px;
        letter-spacing: 1.2px;
        font-weight: 800;
        text-transform: uppercase;
        color: #6b8198;
      }
      .muted {
        color: var(--muted);
      }
      .tiny {
        font-size: 11px;
        line-height: 1.55;
      }
      .small {
        font-size: 12.5px;
        line-height: 1.6;
      }
      .title {
        font-size: 19px;
        letter-spacing: -0.25px;
        margin: 0 0 7px;
      }
      .h3 {
        font-weight: 780;
        font-size: 14px;
        margin: 0;
      }
      .kpi {
        background: linear-gradient(145deg, #fff, #f8fbff);
        border: 1px solid #dce8f1;
        border-radius: 13px;
        padding: 15px;
      }
      .kpi .val {
        font-size: 26px;
        line-height: 1.1;
        font-weight: 820;
        color: #142e4e;
        margin: 8px 0 5px;
        letter-spacing: -0.6px;
      }
      .kpi .desc {
        font-size: 11px;
        color: #758aa0;
        line-height: 1.45;
      }
      .badge {
        display: inline-block;
        border-radius: 6px;
        background: #eaf1f8;
        color: #2b5279;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.1px;
        padding: 4px 7px;
        white-space: normal;
      }
      .badge.orange {
        background: #fff0d9;
        color: #925415;
      }
      .badge.red {
        background: #ffebeb;
        color: #9e3535;
      }
      .badge.green {
        background: #e3f4e9;
        color: #1c6448;
      }
      .badge.dark {
        background: #e8f0f7;
        color: #214769;
      }
      .btn {
        border: 1px solid #c9d7e4;
        background: #fff;
        color: #24547e;
        border-radius: 8px;
        padding: 9px 12px;
        font-weight: 720;
        font-size: 12px;
      }
      .btn:hover {
        background: #f1f7fd;
      }
      .btn.primary {
        background: #1e558a;
        border-color: #1e558a;
        color: #fff;
      }
      .btn.primary:hover {
        background: #164675;
      }
      .btn.soft {
        background: #eaf2fa;
      }
      .btn.danger {
        color: #983c37;
        border-color: #efccca;
      }
      .btn.smallbtn {
        font-size: 11px;
        padding: 6px 9px;
      }
      .field {
        min-width: 0;
        background: #fff;
        border: 1px solid #cbd9e5;
        border-radius: 8px;
        padding: 9px 10px;
        color: #283f57;
        max-width: 100%;
        font-size: 13px;
      }
      .field[type="search"] {
        min-width: 220px;
      }
      .controlbox {
        background: #fff;
        border: 1px solid #dce5ee;
        border-radius: 12px;
        padding: 14px;
      }
      .checks {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 7px;
        background: #fff;
        border: 1px solid #d8e3ed;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 12px;
        font-weight: 650;
        white-space: nowrap;
        cursor: pointer;
      }
      .check:has(input:checked) {
        background: #e7f1fc;
        border-color: #91b9e0;
        color: #164f83;
      }
      .check input {
        accent-color: #27659a;
      }
      .divider {
        border: 0;
        border-top: 1px solid #e3ebf2;
        margin: 16px 0;
      }
      .note {
        font-size: 12px;
        line-height: 1.65;
        border: 1px solid #e1d1af;
        background: #fffaf0;
        color: #70562c;
        border-radius: 9px;
        padding: 11px 14px;
      }
      .note.blue {
        background: #f1f7fd;
        border-color: #d4e5f5;
        color: #3c5c79;
      }
      .note.red {
        background: #fff2f2;
        border-color: #edd0d0;
        color: #864747;
      }
      .listnone {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .split {
        display: grid;
        grid-template-columns: 226px minmax(0, 1fr);
        gap: 16px;
        align-items: start;
      }
      .sidebar {
        position: sticky;
        top: 16px;
      }
      .sidebutton {
        display: block;
        width: 100%;
        text-align: left;
        border: none;
        border-radius: 8px;
        background: transparent;
        padding: 10px;
        color: #425a73;
        font-size: 12px;
        font-weight: 700;
      }
      .sidebutton:hover {
        background: #f1f5f9;
      }
      .sidebutton.active {
        background: #e4f0fc;
        color: #194d7d;
      }
      .tasks {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin: 10px 0 0;
        padding: 0;
        list-style: none;
        counter-reset: task;
      }
      .tasks li {
        counter-increment: task;
        border: 1px solid #e1eaf2;
        background: #f8fbfe;
        border-radius: 9px;
        padding: 10px 10px 10px 38px;
        position: relative;
        font-size: 12px;
        line-height: 1.45;
      }
      .tasks li:before {
        content: counter(task);
        position: absolute;
        left: 12px;
        top: 10px;
        font-size: 14px;
        font-weight: 850;
        color: #326b9f;
      }
      .tasks li small {
        display: block;
        color: #7b8999;
        margin-top: 5px;
      }
      .expand {
        border: 1px solid #dfe8f1;
        border-radius: 9px;
        background: #fafdff;
        margin-top: 7px;
      }
      .expand summary {
        cursor: pointer;
        padding: 10px 13px;
        font-size: 12px;
        font-weight: 760;
        color: #244c73;
      }
      .expand .inside {
        padding: 1px 13px 13px;
      }
      .expand p {
        font-size: 12px;
        line-height: 1.6;
        color: #4d6379;
      }
      .tablewrap {
        overflow: auto;
        max-height: 78vh;
        border: 1px solid #dbe5ef;
        border-radius: 11px;
        overscroll-behavior: contain;
        scrollbar-color: #b3c9dc #f1f5f9;
      }
      .compare {
        width: max-content;
        border-collapse: separate;
        border-spacing: 0;
        table-layout: fixed;
      }
      .compare th,
      .compare td {
        width: 273px;
        min-width: 273px;
        max-width: 273px;
        vertical-align: top;
        padding: 10px;
        border-right: 1px solid #e0eaf2;
        border-bottom: 1px solid #e0eaf2;
        text-align: left;
        background: #fff;
      }
      .compare thead th {
        position: sticky;
        top: 0;
        z-index: 3;
        background: #e9f1fa;
        color: #1c4167;
        font-size: 12px;
      }
      .compare th:first-child,
      .compare td:first-child {
        width: 235px;
        min-width: 235px;
        max-width: 235px;
        position: sticky;
        left: 0;
        z-index: 2;
        background: #f5f9fd;
      }
      .compare thead th:first-child {
        z-index: 4;
        background: #e0ecf8;
      }
      .compare tbody tr:nth-child(even) td:not(:first-child) {
        background: #fcfdff;
      }
      .servicename {
        font-size: 12px;
        font-weight: 820;
        line-height: 1.47;
      }
      .offer {
        background: #fff;
        border: 1px solid #dce6f0;
        border-radius: 9px;
        padding: 10px;
        margin: 0 0 7px;
        box-shadow: 0 1px 2px #12315308;
      }
      .offerTitle {
        font-size: 12px;
        font-weight: 760;
        line-height: 1.45;
        margin: 0 0 5px;
      }
      .money {
        font-weight: 820;
        color: #1f527e;
        font-size: 16px;
        white-space: nowrap;
      }
      .offer .source {
        font-size: 10px;
        color: #657b90;
        line-height: 1.5;
        margin-top: 7px;
        padding-top: 6px;
        border-top: 1px dashed #d9e3ec;
        overflow-wrap: anywhere;
      }
      .offer .sub {
        font-size: 11px;
        color: #526b81;
        line-height: 1.5;
        margin-top: 6px;
      }
      .empty {
        border: 1px dashed #d3dfe9;
        background: #fafcfe;
        border-radius: 8px;
        padding: 13px;
        font-size: 11px;
        color: #6c8192;
        line-height: 1.5;
      }
      .quoteCard {
        border: 1px solid #dce6ee;
        background: #fff;
        border-radius: 13px;
        padding: 16px;
      }
      .quoteCard .number {
        font-size: 25px;
        font-weight: 850;
        letter-spacing: -0.6px;
        color: #174977;
        line-height: 1.2;
        margin: 7px 0;
      }
      .bartrack {
        height: 8px;
        background: #e5edf5;
        border-radius: 50px;
        overflow: hidden;
        margin-top: 12px;
      }
      .barfill {
        background: linear-gradient(90deg, #408bc0, #2a648f);
        height: 100%;
        border-radius: 50px;
      }
      .service-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 9px;
      }
      .valuegrid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 11px;
      }
      .valuegrid > div {
        border: 1px solid #e5edf5;
        border-radius: 8px;
        padding: 9px;
        background: #f9fbff;
      }
      .valuename {
        font-size: 10px;
        color: #7b90a3;
      }
      .value {
        font-size: 14px;
        font-weight: 780;
        margin-top: 5px;
        color: #233e59;
      }
      .results {
        display: grid;
        gap: 8px;
      }
      .itemRow {
        display: grid;
        grid-template-columns:
          minmax(220px, 1.6fr) minmax(140px, 0.6fr) minmax(115px, 0.55fr)
          minmax(120px, 0.55fr) 85px;
        gap: 10px;
        border: 1px solid #e1e9f1;
        background: #fff;
        border-radius: 10px;
        padding: 12px;
        align-items: center;
      }
      .itemRow:hover {
        border-color: #aec8de;
      }
      .itemRow .name {
        font-weight: 760;
        font-size: 12px;
        line-height: 1.4;
      }
      .itemRow .data {
        font-size: 12px;
      }
      .itemRow details {
        margin-top: 4px;
      }
      .itemRow details summary {
        font-size: 11px;
        color: #235d8d;
        cursor: pointer;
      }
      .itemRow details p {
        line-height: 1.55;
        color: #516579;
        font-size: 11px;
      }
      .statusPill {
        font-size: 10px;
        font-weight: 750;
        background: #eff4f9;
        color: #4e657e;
        border-radius: 5px;
        padding: 4px 7px;
        display: inline-block;
      }
      .statusPill.optional {
        background: #fff4da;
        color: #8a6117;
      }
      .statusPill.unpriced {
        background: #ebedf0;
        color: #6e7c8c;
      }
      .statusPill.deposit {
        background: #ede9fa;
        color: #68528c;
      }
      .statusPill.component {
        background: #e7f6ed;
        color: #356b50;
      }
      .scenarioList {
        display: grid;
        gap: 9px;
      }
      .scenarioRow {
        display: grid;
        grid-template-columns: 1fr 125px 105px 70px;
        gap: 10px;
        align-items: center;
        border: 1px solid #e1e9f1;
        border-radius: 9px;
        padding: 10px;
        background: #fff;
      }
      .scenarioRow input[type="number"] {
        width: 90px;
      }
      .risk {
        border-left: 3px solid #e3a354;
        padding: 12px;
        background: #fffcf7;
        border-radius: 7px;
        margin: 8px 0;
      }
      .risk.high {
        border-color: #cd6565;
        background: #fff8f8;
      }
      .risk h4 {
        margin: 0 0 4px;
        font-size: 13px;
      }
      .risk p {
        margin: 0 0 4px;
        font-size: 12px;
        line-height: 1.6;
        color: #53677d;
      }
      .fileRef {
        font-size: 10px;
        color: #728394;
        overflow-wrap: anywhere;
      }
      .costcol {
        text-align: right;
      }
      .foot {
        margin: 28px 2px 0;
        font-size: 11px;
        color: #718397;
        line-height: 1.6;
      }
      .desktopOnly {
      }
      .mobileOnly {
        display: none;
      }
      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #76b99f;
        margin-right: 5px;
      }
      .toc {
        font-size: 12px;
        line-height: 1.7;
      }
      .outline {
        border: 1px solid #dde7f1;
        background: #f8fbff;
        border-radius: 9px;
        padding: 12px;
      }
      .hint {
        border-left: 3px solid #a3c1db;
        padding-left: 10px;
        font-size: 11px;
        color: #6c8093;
        line-height: 1.5;
      }
      .mutedlink {
        color: #4f7597;
      }
      #noticeRefresh {
        display: none;
      }
      @media (max-width: 1200px) {
        .grid5 {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .grid4 {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 980px) {
        .split {
          grid-template-columns: 1fr;
        }
        .sidebar {
          position: static;
        }
        .desktopOnly {
          display: none;
        }
        .mobileOnly {
          display: block;
        }
        .tasks {
          grid-template-columns: 1fr;
        }
        .grid3 {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .itemRow {
          grid-template-columns: 1fr 130px 120px;
        }
        .itemRow .hideNarrow {
          display: none;
        }
        .itemRow > :last-child {
          text-align: right;
        }
      }
      @media (max-width: 650px) {
        .topinner {
          padding: 18px 14px 14px;
        }
        .container {
          padding: 13px 12px 45px;
        }
        .brandrow h1 {
          font-size: 23px;
        }
        .headright {
          min-width: 0;
          text-align: left;
        }
        .brandrow {
          flex-wrap: wrap;
        }
        .tabs {
          margin-top: 14px;
        }
        .tabs button {
          padding: 9px 11px;
          font-size: 11px;
        }
        .grid2,
        .grid3,
        .grid4,
        .grid5 {
          grid-template-columns: 1fr;
        }
        .panel {
          padding: 14px;
        }
        .kpi .val {
          font-size: 22px;
        }
        .itemRow {
          grid-template-columns: 1fr 110px;
          gap: 6px;
        }
        .itemRow > :nth-child(3) {
          display: none;
        }
        .scenarioRow {
          grid-template-columns: 1fr 90px;
          gap: 8px;
        }
        .scenarioRow > :nth-child(3) {
          text-align: left;
        }
        .flexbetween {
          align-items: flex-start;
        }
        .field[type="search"] {
          min-width: 140px;
          width: 100%;
        }
        .compare th,
        .compare td {
          width: 260px;
          min-width: 260px;
          max-width: 260px;
        }
        .compare th:first-child,
        .compare td:first-child {
          width: 170px;
          min-width: 170px;
          max-width: 170px;
        }
        .valuegrid {
          grid-template-columns: 1fr 1fr;
        }
      }

      /* Keep comparison table's minimum width inside its own scrollport. */
      .stack {
        grid-template-columns: minmax(0, 1fr);
        min-width: 0;
      }
      .stack > * {
        min-width: 0;
      }
      .split > * {
        min-width: 0;
      }
      .panel,
      .controlbox,
      .tablewrap {
        min-width: 0;
        max-width: 100%;
      }
      .tablewrap {
        width: 100%;
      }
      .tasks,
      .tasks li {
        min-width: 0;
      }
      .tasks li,
      .offer {
        overflow-wrap: anywhere;
      }
      .checks {
        max-width: 100%;
      }
      .check {
        max-width: 100%;
        white-space: normal;
      }

      /* Detailed committee budgets V3.1 */
      .budgetTop {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }
      .budgetGrid {
        display: grid;
        gap: 13px;
      }
      .budgetTable {
        width: 100%;
        border-collapse: collapse;
        min-width: 720px;
      }
      .budgetTable th,
      .budgetTable td {
        border-bottom: 1px solid #e2eaf1;
        padding: 11px;
        text-align: right;
        font-size: 12px;
        vertical-align: middle;
      }
      .budgetTable th {
        font-size: 11px;
        color: #4f6b85;
        background: #f5f9fd;
      }
      .budgetTable th:first-child,
      .budgetTable td:first-child {
        text-align: left;
      }
      .budgetTable tr:hover td {
        background: #f7fafd;
      }
      .budgetTable tr.active td {
        background: #e9f2fa;
      }
      .budgetBar {
        height: 7px;
        background: #e3ebf2;
        border-radius: 9px;
        overflow: hidden;
        margin-top: 6px;
      }
      .budgetBar > div {
        background: #42769b;
        height: 100%;
        border-radius: 9px;
      }
      .budgetLine {
        display: grid;
        grid-template-columns:
          minmax(200px, 1fr) minmax(180px, 0.8fr)
          90px 130px 92px;
        gap: 12px;
        align-items: center;
        border-bottom: 1px solid #e5ecf3;
        padding: 13px 0;
      }
      .budgetLine:last-child {
        border-bottom: 0;
      }
      .budgetSource {
        font-size: 10px;
        color: #6c8298;
        line-height: 1.5;
        overflow-wrap: anywhere;
        margin-top: 5px;
      }
      .budgetFigure {
        font-weight: 800;
        font-size: 14px;
        color: #1b4e7b;
        text-align: right;
        white-space: nowrap;
      }
      .budgetCheck {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        cursor: pointer;
        justify-content: flex-end;
      }
      .budgetLine input[type="number"] {
        width: 76px;
        max-width: 100%;
        text-align: right;
      }
      .budgetSubrow {
        background: #f7fafd;
        border-radius: 9px;
        padding: 11px 14px;
        display: grid;
        gap: 5px;
        margin: 9px 0;
      }
      .budgetLegend {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .budgetNotice {
        border: 1px solid #dce6ef;
        padding: 12px 14px;
        border-radius: 9px;
        background: #f8fbfe;
        font-size: 12px;
        line-height: 1.65;
        color: #52677b;
      }
      @media (max-width: 1150px) {
        .budgetTop {
          grid-template-columns: repeat(2, 1fr);
        }
        .budgetLine {
          grid-template-columns: minmax(165px, 1fr) 125px 80px 105px 78px;
          gap: 7px;
        }
      }
      @media (max-width: 750px) {
        .budgetTop {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .budgetLine {
          grid-template-columns: minmax(0, 1fr) 115px;
          gap: 9px;
          padding: 12px 0;
        }
        .budgetLine > .budgetMobileFull {
          grid-column: 1/-1;
        }
        .budgetLine .budgetFigure {
          grid-column: 2;
          grid-row: 1;
        }
        .budgetLine .budgetCheck {
          grid-column: 2;
          grid-row: 2;
        }
        .budgetLine .budgetQty {
          grid-column: 2;
          grid-row: 3;
        }
        .budgetLine .budgetBasis {
          grid-column: 1;
          grid-row: 3;
        }
        .budgetTable {
          min-width: 660px;
        }
        .budgetTop .kpi .val {
          font-size: 21px;
        }
      }

          return `<div class="stack"><section class="panel"><div class="flexbetween wrap"><div><h2 class="title">Mix-and-match budget sandbox</h2><div class="small muted">Select any combination of companies and items. This is a hypothetical local estimate, not an accepted quotation, purchase order or approved budget.</div></div><button class="btn danger" data-act="clear-scenario">Clear estimate</button></div><div class="grid grid4" style="margin-top:15px"><div class="kpi"><div class="slabel">Selected distinct lines</div><div class="val">${z.selected.length}</div><div class="desc">Identical line IDs counted once even if shown under multiple committees</div></div><div class="kpi"><div class="slabel">Item subtotal before tax</div><div class="val" style="font-size:24px">${rmn(z.subtotal)}</div><div class="desc">Optional/unit rates reflect chosen quantities</div></div><div class="kpi"><div class="slabel">Tax safely calculable</div><div class="val" style="font-size:24px">${rmn(z.knownTax)}</div><div class="desc">Only where an explicit per-line rate is defensible</div></div><div class="kpi"><div class="slabel">Subtotal + known tax</div><div class="val" style="font-size:24px">${rmn(z.subtotal + z.knownTax)}</div><div class="desc">NOT final payable; see uncertain-tax and scope notes below</div></div></div><div class="note" style="margin-top:14px">${z.unknownBase ? `<b>${rm(z.unknownBase)}</b> of selected pre-tax items have tax that cannot be confidently allocated line by line (Apxara / HIT). ` : ""}Third-party costs, packaging restrictions, discounts, fees and vendor minimums may be additional. Dreamz and NeuDimenxion's quoted whole-proposal totals include SST. Apxara's RM6,520 overall SST is not distributed to individual lines.</div>${overlapping.length ? `<div class="note red" style="margin-top:9px"><b>Potential duplicate scope:</b> multiple companies are selected for ${overlapping.length} comparison group(s). Review: ${safe(overlapping.slice(0, 5).join("; "))}${overlapping.length > 5 ? "…" : ""}.</div>` : ""}</section>
<section class="grid grid2"><div class="panel"><h3 class="h3">Selected spend by company · before uncertain tax</h3>${
            Object.entries(z.byVendor)
              .sort((a, b) => b[1] - a[1])
              .map(
                ([v, s]) =>
                  `<div class="flexbetween" style="border-bottom:1px solid #e6edf4;padding:10px 0"><span class="small">${safe(v)}</span><b>${rm(s)}</b></div>`,
              )
              .join("") ||
            '<p class="small muted">Add items to see the mix.</p>'
          }</div><div class="panel"><h3 class="h3">Selected spend by primary committee</h3>${
            Object.entries(z.byCommittee)
              .sort((a, b) => b[1] - a[1])
              .map(
                ([c, s]) =>
                  `<div class="flexbetween" style="border-bottom:1px solid #e6edf4;padding:10px 0"><span class="small">${safe(cm[c]?.name || (c === "cross" ? "Shared / central management" : c))}</span><b>${rm(s)}</b></div>`,
              )
              .join("") || '<p class="small muted">Nothing selected yet.</p>'
          }<div class="hint" style="margin-top:11px">Shared PCO fees are placed under “Shared / central management,” not copied into each committee total.</div></div></section>
<section class="panel"><div class="flexbetween wrap"><h3 class="h3">Selected line items</h3><span class="badge">Browser-only draft · original quotations unchanged</span></div><div class="scenarioList" style="margin-top:12px">${z.selected.map(({ item: i, qty }) => `<div class="scenarioRow"><div><b style="font-size:12px">${safe(i.name)}</b><div class="tiny muted">${safe(i.vendor)} · ${safe(i.source)} p. ${safe(i.page)}</div></div><div>${i.kind === "unit" ? `<label class="tiny muted" for="qty${i.id}">Quantity</label><input class="field" style="display:block;max-width:95px" id="qty${i.id}" type="number" min="1" step="1" value="${qty}" data-qty="${i.id}">` : '<span class="small muted">Fixed price</span>'}</div><div><b style="font-size:12px">${rm(i.kind === "unit" ? i.price * qty : i.price)}</b></div><div><button class="btn smallbtn danger" data-pick="${i.id}">Remove</button></div></div>`).join("") || '<div class="note blue">No items selected. Choose from the committee comparison or the catalogue below.</div>'}</div></section>
${commonFilters()}<section class="panel"><div class="flexbetween wrap"><h3 class="h3">Add quoted services to estimate</h3><span class="tiny muted">First 80 matches displayed; use search to narrow results</span></div><div class="flex wrap" style="margin:12px 0"><input id="scenarioSearch" type="search" placeholder="Search equipment, booths, website…" class="field" style="flex:2" value="${safe(state.scenarioQuery)}"><select id="scenarioVendor" class="field"><option value="all">All vendors</option>${order.map((v) => `<option value="${safe(v)}" ${state.scenarioVendor === v ? "selected" : ""}>${safe(v)}</option>`).join("")}</select><select id="scenarioCommittee" class="field"><option value="all">All committees</option>${DB.committees.map((c) => `<option value="${c.id}" ${state.scenarioFilter === c.id ? "selected" : ""}>${safe(c.name)}</option>`).join("")}</select></div><div class="results">${choices.map(itemRow).join("") || '<div class="note">No available priced line item for these filters.</div>'}</div><p class="hint" style="margin-top:14px">Line-item prices drawn from PCO package quotations might not be independently purchasable. Obtain confirmation if splitting the bundle between companies.</p></section></div>`;
        }
        function issues() {
          const issues = DB.issues;
          return `<div class="stack"><section class="panel"><h2 class="title">Source provenance & procurement issues</h2><p class="small muted">Every item cites a document and page. The dashboard contains source references rather than embedded PDFs to minimise storage. No quotation data is uploaded or changed by this local app.</p><div class="grid grid2" style="margin-top:15px">${DB.quotes.map((q) => `<div class="quoteCard"><div class="flexbetween"><div class="h3">${safe(vmap[q.vendor].name)}</div><span class="badge">${q.total != null ? rmn(q.total) : "Unpriced / unit rates"}</span></div><div class="tiny muted" style="margin-top:5px"><b>${safe(q.filename)}</b> · ${q.pages} page(s) · ref. ${safe(q.ref)}</div><p class="small">${safe(q.scope)}</p><details class="expand"><summary>Conditions, tax and validity</summary><div class="inside"><p><b>Validity:</b> ${safe(q.validity)}</p><p>${safe(q.conditions)}</p></div></details></div>`).join("")}</div></section><section class="panel"><div class="flexbetween wrap"><h2 class="title">Issues for clarification · ${issues.length}</h2><span class="badge red">Not procurement approval</span></div>${issues.map((x) => `<div class="risk ${x.severity === "high" ? "high" : ""}"><div class="flexbetween wrap"><h4>${safe(x.title)}</h4><span class="badge ${x.severity === "high" ? "red" : "orange"}">${safe(x.severity)}</span></div><p>${safe(x.detail)}</p><span class="fileRef">${safe(x.vendor)} · ${safe(x.source)} · page ${safe(x.page)} · ${safe(x.topic)}</span></div>`).join("")}</section></div>`;
        }

        function budgetLines(c) {
          return [...c.lines, ...(c.options || [])];
        }
        function budgetSetting(l) {
          const draft = budgetDraft[l.id] || {};
          return {
            enabled: Object.hasOwn(draft, "enabled")
              ? draft.enabled
              : l.selected,
            qty: Object.hasOwn(draft, "qty") ? draft.qty : l.qty,
          };
        }
        function budgetLineTotal(l) {
          const opt = budgetSetting(l);
          return Math.round(l.rate * opt.qty * 100) / 100;
        }
        function calcBudget() {
          const all = budgetPlan.committees.map((c) => {
            const selected = budgetLines(c).filter(
              (l) => budgetSetting(l).enabled,
            );
            const baseC = selected.reduce(
              (v, l) => v + Math.round(budgetLineTotal(l) * 100),
              0,
            );
            const reserveC = Math.round(
              (baseC * budgetPlan.contingencyPct) / 100,
            );
            const histC = selected
              .filter((l) => l.kind === "historical")
              .reduce((v, l) => v + Math.round(budgetLineTotal(l) * 100), 0);
            const quoteC = baseC - histC;
            return {
              id: c.id,
              name: c.name,
              base: baseC / 100,
              reserve: reserveC / 100,
              total: (baseC + reserveC) / 100,
              history: histC / 100,
              quotes: quoteC / 100,
              selected: selected.length,
            };
          });
          return {
            rows: all,
            base: all.reduce((s, c) => s + c.base, 0),
            reserve: all.reduce((s, c) => s + c.reserve, 0),
            total: all.reduce((s, c) => s + c.total, 0),
            history: all.reduce((s, c) => s + c.history, 0),
            quotes: all.reduce((s, c) => s + c.quotes, 0),
          };
        }
        function budgetPage() {
          const z = calcBudget();
          const byIdB = Object.fromEntries(z.rows.map((r) => [r.id, r]));
          const current =
            budgetPlan.committees.find((c) => c.id === budgetCommittee) ||
            budgetPlan.committees[0];
          const q = byIdB[current.id];
          const mx = Math.max(...z.rows.map((a) => a.total));
          const main = z.rows.filter((a) => a.id !== "central");
          const sMain = main.reduce((t, r) => t + r.total, 0);
          return `<div class="stack">
<section class="panel"><div class="flexbetween wrap"><div><h2 class="title">Provisional 2027 budgets by committee</h2><p class="small muted">Based on the available 2027 vendor quotations and itemised 2026 financial handover. Every committee includes a separate <strong>5% contingency</strong>.</p></div><span class="badge orange">Planning estimate · not an approved budget</span></div><div class="budgetTop" style="margin-top:15px">
<div class="kpi"><div class="slabel">Base allowances</div><div class="val" style="font-size:22px">${rm(z.base)}</div><div class="desc">Historical placeholders + quoted services</div></div>
<div class="kpi"><div class="slabel">5% contingency</div><div class="val" style="font-size:22px">${rm(z.reserve)}</div><div class="desc">Calculated per committee, then summed</div></div>
<div class="kpi"><div class="slabel">Total incl. +5%</div><div class="val" style="font-size:23px">${rm(z.total)}</div><div class="desc">Nine committees + one shared cost centre</div></div>
<div class="kpi"><div class="slabel">Historical source basis</div><div class="val" style="font-size:22px">${Math.round((z.history / (z.base || 1)) * 100)}%</div><div class="desc">Much of this estimate depends on 2026 costs</div></div>
</div><div class="budgetNotice" style="margin-top:13px">This is a <b>hybrid placeholder estimate</b>, NOT a signed 2027 quotation. <b>Approximately 75% of base costs are 2026 historical placeholders, particularly a Pahang venue instead of a confirmed Selangor venue.</b> Current quotations may not be independently purchasable outside a PCO package. <b>Taxes, unquoted services, venue changes, and vendor renegotiation are not resolved.</b> The 5% reserve is contingency, <b>not</b> SST. Adjusting quantities/including items here affects only this local planning screen.</div></section>
<section class="panel"><div class="flexbetween wrap"><div><h3 class="title">Committee budget summary</h3><p class="tiny muted">Select a committee row to inspect its detailed item-by-item allowance. Shared management appears once, not nine times.</p></div><button class="btn smallbtn" data-act="reset-budget">Reset to default estimate</button></div><div class="tablewrap" style="margin-top:12px;max-height:none"><table class="budgetTable"><thead><tr><th>Committee</th><th>Base budget</th><th>5% extra</th><th>Est. total</th><th>2026 historical share</th></tr></thead><tbody>${z.rows.map((r) => `<tr class="${current.id === r.id ? "active" : ""}"><td><button class="btn smallbtn" style="text-align:left;border:none;background:none;white-space:normal" data-bcommittee="${r.id}"><b>${safe(r.name)}</b></button><div class="budgetBar"><div style="width:${Math.max(1, (r.total / mx) * 100).toFixed(2)}%"></div></div></td><td>${rm(r.base)}</td><td>${rm(r.reserve)}</td><td><strong>${rm(r.total)}</strong></td><td>${r.base ? Math.round((r.history / r.base) * 100) : 0}%</td></tr>`).join("")}<tr><td><b>All nine committees + Shared/Central</b></td><td><b>${rm(z.base)}</b></td><td><b>${rm(z.reserve)}</b></td><td><b>${rm(z.total)}</b></td><td>${Math.round((z.history / (z.base || 1)) * 100)}%</td></tr></tbody></table></div><p class="tiny muted" style="margin-top:12px">Nine committee budgets total ${rm(sMain)} including contingency; the shared/central budget is ${rm(byIdB.central.total)}. Both are shown separately to prevent duplicate allocation.</p></section>
<section class="panel" id="budget-detail"><div class="flexbetween wrap"><div><div class="slabel">Detailed budget · ${safe(current.name)}</div><h2 class="title" style="margin:8px 0">${rm(q.total)} <span class="small muted">including +5%</span></h2><p class="small muted">${safe(current.justification)}</p></div><div style="text-align:right"><div class="tiny muted">Before reserve: <b>${rm(q.base)}</b></div><div class="tiny muted">Reserve (5%): <b>${rm(q.reserve)}</b></div><button class="btn smallbtn" ${current.id === "central" ? "disabled" : ""} data-quickcommittee="${current.id}" style="margin-top:9px">View quotation comparison</button></div></div>
<div class="budgetLegend" style="margin-top:14px"><span class="badge">2027 quoted item / price</span><span class="badge orange">2026 historical cost / estimate</span><span class="small muted">Uncheck an item to exclude it; adjust quantities only where a quote gives a unit rate.</span></div>
<div class="budgetGrid" style="margin-top:11px">${current.lines.map(budgetRow).join("")}</div>
${current.options.length ? `<details class="expand"><summary>Additional alternatives / optional costs (${current.options.length}, not included by default)</summary><div class="inside"><div class="budgetGrid">${current.options.map(budgetRow).join("")}</div></div></details>` : ""}
<div class="budgetSubrow"><div class="flexbetween"><span>Selected base budget</span><b>${rm(q.base)}</b></div><div class="flexbetween"><span>5% contingency</span><b>${rm(q.reserve)}</b></div><div class="flexbetween"><strong>Committee total estimate</strong><strong>${rm(q.total)}</strong></div></div>
<div class="budgetNotice" style="margin-top:12px"><b>Uncertainty / items for quotation:</b> ${safe(current.risk)}</div>
</section>
<section class="panel"><h3 class="title">How the estimate was assembled</h3><ol class="small" style="line-height:1.85;margin:8px 0 0;padding-left:21px"><li>Use identifiable 2027 vendor items when reasonably attributable to one committee, including conditional mix-and-match services.</li><li>Where essential services still have no 2027 quotation, carry forward 2026 actual expenditure explicitly as a <b>historical placeholder</b>—especially the convention venue and accommodation.</li><li>Keep all shared conference management fees in a separate <b>Shared / Central</b> cost centre, counted once.</li><li>Exclude optional and alternative quotations unless explicitly added; exclude refundable deposits from spend.</li><li>Calculate each committee's contingency as <b>base × 5%</b>, rounded to cents. This does not substitute for taxes or unquoted supplier costs.</li></ol><p class="small muted" style="margin-top:12px">Historic sources: Summary Income and Expenditure for FMSC.pptx (slides 5–9); Free Paper handover (p. 5); Promotion handover (p. 4). The historical Promotion RM40 discrepancy is excluded from the budget. The 2027 vendor price lines cite their quotation filenames and page numbers individually above.</p></section>
</div>`;
        }
        function budgetRow(l) {
          const v = budgetSetting(l),
            cost = budgetLineTotal(l),
            id = safe(l.id);
          const kind = l.kind === "quotation" ? "2027 quote" : "2026 reference";
          return `<div class="budgetLine"><div class="budgetMobileFull"><b class="small">${safe(l.label)}</b><div class="budgetSource">${safe(l.source)} · ${l.kind === "quotation" ? "p." : "slide / p."} ${safe(l.page)}${l.vendor ? " · " + safe(l.vendor) : ""}</div><div class="tiny muted" style="margin-top:5px">${safe(l.detail || l.basis)}</div></div><div class="budgetBasis"><span class="badge ${l.kind === "historical" ? "orange" : ""}">${kind}</span><div class="tiny muted" style="margin-top:5px">${rm(l.rate)}${l.adjustable ? " / unit" : ""}</div></div><div class="budgetQty">${l.adjustable ? `<label class="tiny muted">Qty <input class="field" type="number" min="1" max="10000" step="1" data-bqty="${id}" value="${v.qty}"></label>` : `<span class="tiny muted">${v.qty > 1 ? v.qty + " units" : "Fixed amount"}</span>`}</div><div class="budgetFigure">${rm(cost)}</div><label class="budgetCheck"><input type="checkbox" data-btoggle="${id}" ${v.enabled ? "checked" : ""}>Include</label></div>`;
        }

        function render() {
          document
            .querySelectorAll("[data-nav]")
            .forEach((b) =>
              b.classList.toggle("active", b.dataset.nav === state.page),
            );
          el.innerHTML =
            state.page === "overview"
              ? overview()
              : state.page === "budgets"
                ? budgetPage()
                : state.page === "committee"
                  ? committee()
                  : state.page === "catalog"
                    ? catalog()
                    : state.page === "scenario"
                      ? scenario()
                      : issues();
        }
        function act(e) {
          const b = e.target.closest("button");
          if (b) {
            if (b.dataset.nav) {
              state.page = b.dataset.nav;
              state.catalogShown = 60;
              render();
              window.scrollTo(0, 0);
              return;
            }
            if (b.dataset.bcommittee) {
              budgetCommittee = b.dataset.bcommittee;
              render();
              return;
            }
            if (b.dataset.quickcommittee) {
              state.committee = b.dataset.quickcommittee;
              state.page = "committee";
              state.compareQuery = "";
              render();
              window.scrollTo(0, 0);
              return;
            }
            if (b.dataset.committee) {
              state.committee = b.dataset.committee;
              state.compareQuery = "";
              render();
              return;
            }
            if (b.dataset.pick) {
              let id = Number(b.dataset.pick);
              if (Object.hasOwn(state.selected, id)) delete state.selected[id];
              else {
                const i = byId[id];
                if (isSelectable(i)) {
                  state.selected[id] = i.kind === "unit" ? i.quotedQty || 1 : 1;
                }
              }
              persist();
              render();
              return;
            }
            if (b.dataset.act) {
              const a = b.dataset.act;
              if (a === "all-vendors") state.active = new Set(order);
              if (a === "clear-vendors") state.active = new Set();
              if (a === "toggle-tasks")
                state.sidebarTasks = !state.sidebarTasks;
              if (a === "more-catalog") state.catalogShown += 50;
              if (a === "clear-scenario") {
                state.selected = {};
                persist();
              }
              if (a === "reset-budget") {
                for (const k of Object.keys(budgetDraft)) delete budgetDraft[k];
              }
              render();
              return;
            }
          }
        }
        document.addEventListener("click", act);
        document.addEventListener("change", (e) => {
          const t = e.target;
          if (t.dataset.btoggle) {
            const l = budgetPlan.committees
              .flatMap((c) => budgetLines(c))
              .find((x) => x.id === t.dataset.btoggle);
            if (l) {
              budgetDraft[l.id] = {
                ...(budgetDraft[l.id] || {}),
                enabled: t.checked,
              };
              if (t.checked && l.quoteItemId === 51) {
                const other = budgetPlan.committees
                  .flatMap((c) => budgetLines(c))
                  .find((x) => x.quoteItemId === 59);
                if (other)
                  budgetDraft[other.id] = {
                    ...(budgetDraft[other.id] || {}),
                    enabled: false,
                  };
              }
              if (t.checked && l.quoteItemId === 55) {
                const other = budgetPlan.committees
                  .flatMap((c) => budgetLines(c))
                  .find((x) => x.quoteItemId === 62);
                if (other)
                  budgetDraft[other.id] = {
                    ...(budgetDraft[other.id] || {}),
                    enabled: false,
                  };
              }
            }
            render();
            return;
          }
          if (t.dataset.bqty) {
            const l = budgetPlan.committees
              .flatMap((c) => budgetLines(c))
              .find((x) => x.id === t.dataset.bqty);
            if (l && l.adjustable) {
              budgetDraft[l.id] = {
                ...(budgetDraft[l.id] || {}),
                qty: Math.min(
                  10000,
                  Math.max(1, Math.round(Number(t.value) || 1)),
                ),
              };
            }
            window.requestAnimationFrame(render);
            return;
          }
          if (t.dataset.company) {
            t.checked
              ? state.active.add(t.dataset.company)
              : state.active.delete(t.dataset.company);
            render();
            return;
          }
          if (t.dataset.qty) {
            const id = Number(t.dataset.qty),
              qty = Math.max(1, Math.round(Number(t.value) || 1));
            state.selected[id] = qty;
            persist();
            render();
            return;
          }
          if (t.id === "committeeMobile") {
            state.committee = t.value;
            state.compareQuery = "";
            render();
            return;
          }
          const changeMap = {
            compareOnly: "compareOnly",
            catalogVendor: "catalogVendor",
            catalogCommittee: "catalogCommittee",
            catalogKind: "kind",
            catalogCategory: "catalogCategory",
            scenarioVendor: "scenarioVendor",
            scenarioCommittee: "scenarioFilter",
          };
          if (changeMap[t.id]) {
            state[changeMap[t.id]] = t.value;
            state.catalogShown = 60;
            render();
            return;
          }
        });
        let searchDebounce = null;
        document.addEventListener("input", (e) => {
          const t = e.target;
          const map = {
            compareSearch: "compareQuery",
            catalogSearch: "query",
            scenarioSearch: "scenarioQuery",
          };
          if (!map[t.id]) return;
          state[map[t.id]] = t.value;
          clearTimeout(searchDebounce);
          searchDebounce = setTimeout(() => {
            const a = document.activeElement;
            let caret = null;
            try {
              caret = a.selectionStart;
            } catch (e) {}
            render();
            const target = document.getElementById(t.id);
            if (target) {
              target.focus();
              try {
                target.setSelectionRange(caret, caret);
              } catch (e) {}
            }
          }, 160);
        });
        window.__FMSC_TEST__ = {
          data: DB,
          state,
          calcScenario,
          calcBudget,
          budgetDraft,
          budgetPlan,
          render,
          rows,
          byId,
        };
        render();
        if ("serviceWorker" in navigator && location.protocol !== "file:")
          navigator.serviceWorker.register("service-worker.js").catch(() => {});
      })();
    </script>
  </body>
</html>
