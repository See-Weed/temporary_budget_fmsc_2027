        padding: 12px;

      }

        color: #6c4d18;
        font-size: 12px;
        line-height: 1.65;
      }

        align-items: center;
        gap: 10px;
        justify-content: space-between;
        flex-wrap: wrap;
      }

        overflow: auto;
        border: 1px solid #d8e4ee;
        border-radius: 10px;

        border-collapse: separate;

        table-layout: fixed;
      }

        border-right: 1px solid #e1eaf3;
        border-bottom: 1px solid #e1eaf3;

        width: 270px;

        width: 195px;

        left: 0;
        z-index: 2;
        background: #f7faff;
      }

        top: 0;
        background: #e9f0f9;

        background: #e4edf8;
      }

        background: #f4f8fd;

        list-style: none;
        margin: 12px 0 0;
        padding: 0;
        counter-reset: t;

        padding: 11px 12px 11px 35px;
        font-size: 12px;
        line-height: 1.6;
        border-radius: 8px;
        counter-increment: t;

        content: counter(t);
        position: absolute;
        left: 11px;
        font-weight: 800;
        color: #4775a7;

          padding: 0;

        .panel {
          box-shadow: none;
          break-inside: avoid;

        .layout {
          display: block;

        .comparison {

        .comparison th,
        .comparison td {
          min-width: 0;
          width: auto;
          font-size: 9px;
          padding: 5px;

        .tablewrap {

                  "Dreamz excludes prospect database, cold calling, solicitation and negotiation; NeuDimenxion includes exhibitor prospect list but sponsor acquisition terms should be confirmed.",
              },
              {
                service: "Exhibition floorplan and exhibitor coordination",
                offers: {
                  Dreamz: [22],
                  NeuDimenxion: [8],
                  Apxara: [48],
                  "Anderes Fourdy": [85],
                },
                caution:
                  "All cover administration to varying degrees, not actual booth fabrication.",
              },
              {
                service: "Onsite exhibition manager / crew",
                offers: {
                  Dreamz: [22],
                  NeuDimenxion: [8, 1],
                  Apxara: [49, 50],
                  Innogen: [58, 74, 75, 76, 77],
                },
                caution:
                  "Dreamz includes four exhibition crew in RM40k onsite package; Apxara manager and move-in are individually priced.",
              },
              {
                service: "Shell-scheme booths / furniture construction",
                offers: {
                  Dreamz: [],
                  NeuDimenxion: [8],
                  Apxara: [57],
                  Innogen: [59],
                },
                caution:
                  "NeuDimenxion quotes management not construction; Apxara RM900 per booth is optional and excludes carpet.",
              },
              {
                service: "Poster display construction",
                offers: {
                  Dreamz: [],
                  NeuDimenxion: [],
                  Apxara: [51],
                  Innogen: [62],
                },
                caution:
                  "Apxara quote is for 100 panels; there is no comparable separately priced construction quotation in the other two PCO bids.",
              },
              {
                service: "Registration counter and exhibition foyer setup",
                offers: { Dreamz: [22], NeuDimenxion: [1], Apxara: [55] },
                caution:
                  "Apxara counter optional; other scope mostly coordination rather than manufacture.",
              },
              {
                service: "Exhibition information board",
                offers: { Innogen: [63] },
                caution:
                  "Specialist supply quotation; compare dimensions and installation conditions.",
              },
              {
                service: "Exhibition aisle carpet",
                offers: { Innogen: [65] },
                caution:
                  "RM12 per square metre; total depends on venue floor area.",
              },
              {
                service: "Electrical outlets and lights for booths",
                offers: { Innogen: [67, 78, 79, 80] },
                caution:
                  "Power consumption, main cable and organiser charges may be additional.",
              },
              {
                service:
                  "Exhibition professional permits, fire safety and deposits",
                offers: { Innogen: [68, 69, 70, 71, 72, 73] },
                caution:
                  "Some fees and refundable deposits differ from non-refundable expenses.",
              },
              {
                service: "Exhibition setup overtime",
                offers: { Innogen: [66] },
                caution: "RM9,900 is a subtotal, not a rate per unit.",
              },
            ],
          },
          {
            committee: "gala",
            entries: [
              {
                service: "Gala dinner / congress dinner management",
                offers: {
                  Dreamz: [14],
                  NeuDimenxion: [1],
                  Apxara: [24],
                  "Anderes Fourdy": [88],
                },
                caution:
                  "Dreamz specifically states congress dinner social programme management included; NeuDimenxion and Apxara describe overall event management, but dedicated dinner services are not itemised.",
              },
              {
                service: "Dinner registrations and QR admission",
                offers: {
                  Dreamz: [21, 14],
                  NeuDimenxion: [2],
                  Apxara: [25, 33],
                },
                caution:
                  "Confirm whether gala registration and dinner entrance are part of conference registration modules.",
              },
              {
                service: "Gala AV, lighting, stage and entertainment",
                offers: {
                  Dreamz: [14],
                  NeuDimenxion: [6, 4],
                  Apxara: [27, 28, 29],
                },
                caution:
                  "Apxara’s quoted AV is for the main plenary, NOT explicitly for dinner; costs cannot be assumed transferable.",
              },
              {
                service: "Dinner menu and dietary coordination",
                offers: { Dreamz: [14], NeuDimenxion: [7], Apxara: [24] },
                caution: "No dinner catering bill shown as included.",
              },
              {
                service: "Dinner decor, performance, gifts and prizes",
                offers: {
                  Dreamz: [14, 19],
                  NeuDimenxion: [4],
                  Apxara: [44, 47],
                },
                caution:
                  "None of these quotes clearly establishes a complete gala decoration/gifts/performer cost.",
              },
            ],
          },
        ],
      };
      const db = RECORD.data;
      const HANDOVER = RECORD.handover;
      const ROWS = Object.fromEntries(
        RECORD.rows.map((x) => [x.committee, x.entries]),
      );
      const TASKFILE = {
        scientific: "Scientific FMSC Post Mortem.pptx",
        free: "Free Paper FMSC Passover to Selangor 30 Oct 2026.pptx",
        registration: "FMSC POSTMORTEM 2026.pptx",
        technical: "JAWATANKUASA TEKNIKAL IT FMSC 2026 POST MORTEM.pptx",
        logistics: "Meeting Post mortem FMSC 2026- Logistic.pptx",
        protocol: "PROTOCOL PASS OVER 30102026.pptx",
        promotion: "FMSCPahang_Promo Postmortem Short.pdf",
        sponsor: "POST MORTEM MEETING FMSC 2026.pptx",
        gala: "pass over to selangor.pptx",
      };
      const companyOrder = [
        "Dreamz",
        "NeuDimenxion",
        "Apxara",
        "Innogen",
        "Anderes Fourdy",
      ];
      const V = Object.fromEntries(db.vendors.map((v) => [v.id, v]));
      const I = Object.fromEntries(db.items.map((i) => [i.id, i]));
      const C = Object.fromEntries(db.committees.map((c) => [c.id, c]));
      const state = {
        tab: "compare",
        committee: "technical",
        selected: new Set(companyOrder),
        query: "",
        showTasks: true,
        catalog: "Dreamz",
      };
      const esc = (x) =>
        String(x ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const money = (x) =>
        x == null
          ? "Not separately priced"
          : "RM " +
            Number(x).toLocaleString("en-MY", {
              minimumFractionDigits: 2,
              maximumFractionDigits: 2,
            });
      const kind = (i) =>
        ({
          fixed: "Quoted line item",
          optional: "Optional — excluded from total",
          unpriced: "Unpriced scope",
          unit: "Unit price",
          subtotal: "Subtotal",
          deposit: "Refundable deposit",
        })[i.kind] || "Quoted";
      function card(i, mode = "normal") {
        let label =
          mode === "shared"
            ? "Shared fee • not additional"
            : mode === "related"
              ? "Related item — scope differs"
              : kind(i);
        return `<div class="offer"><div class="offertitle">${esc(i.name)}</div><div class="price">${money(i.price)}</div><span class="tag ${mode === "shared" ? "amber" : i.kind === "optional" ? "amber" : ""}">${esc(label)}</span><div class="details">${esc(i.detail || "See original quotation for specifications.")}</div><div class="source">${esc(V[i.vendor].pdf)} · page ${esc(i.page || "not marked")}</div></div>`;
      }
      function offerCell(ids, company) {
        if (!ids.length)
          return `<div class="blank"><b>No matching itemised offer</b><div style="margin-top:5px">No explicit matching quotation identified in this document. Check the clarification note; the wider PCO package may contain related coordination.</div></div>`;
        return ids
          .map((id) => {
            let i = I[id];
            if (!i || i.vendor !== company) return "";
            const shared =
              i.committee === "cross" || [1, 14, 22, 24].includes(id);
            return card(i, shared ? "shared" : "normal");
          })
          .join("");
      }
      function committeeSelect() {
        return `<div class="mobile-committee"><label for="mobileCommittee" class="small muted">Select committee</label><select class="input" id="mobileCommittee" style="width:100%">${db.committees.map((c) => `<option value="${esc(c.id)}" ${state.committee === c.id ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select></div><aside class="panel side"><div class="eyebrow" style="margin-bottom:9px">Select committee</div><div class="pick">${db.committees.map((c) => `<button class="${state.committee === c.id ? "active" : ""}" data-committee="${esc(c.id)}">${esc(c.name)}</button>`).join("")}</div></aside>`;
      }
      function comparison() {
        const c = C[state.committee];
        const tasks = HANDOVER.tasks[c.id] || [];
        const lessons = HANDOVER.lessons[c.id] || [];
        let rows = (ROWS[c.id] || []).filter(
          (r) =>
            !state.query ||
            [
              r.service,
              r.caution,
              ...Object.values(r.offers)
                .flat()
                .map((x) => I[x]?.name || ""),
            ]
              .join(" ")
              .toLowerCase()
              .includes(state.query.toLowerCase()),
        );
        let active = companyOrder.filter((x) => state.selected.has(x));
        return `<div class="layout">${committeeSelect()}<div class="stack"><section class="panel"><div class="eyebrow">Committee reference</div><h2 style="margin:6px 0">${esc(c.name)}</h2><p class="small muted">${esc(c.role || "")}</p><div class="tabsline"><b>Tasks from 2026 handover</b><button class="btn" id="toggleTasks">${state.showTasks ? "Hide tasks" : "Show tasks"}</button></div>${state.showTasks ? `<ol class="tasks">${tasks.map((t) => `<li>${esc(t[0])}<small>${esc(TASKFILE[c.id])} · ${esc(t[1])}</small></li>`).join("")}</ol>` : ""}<details class="expand"><summary>2026 lessons and recommendations</summary>${lessons.map((l) => `<p>${esc(l[0])} <span class="muted">(${esc(l[1])})</span></p>`).join("")}</details></section><section class="panel"><div class="tabsline"><div><h2>Compare event managers for this committee</h2><p class="small muted">All 5 companies selected by default. Untick any company to hide its offers. Three comparable priced quotations are not always available.</p></div><button class="btn" id="reset">Select all</button></div><div class="controls">${companyOrder.map((id) => `<label class="check"><input type="checkbox" data-company="${esc(id)}" ${state.selected.has(id) ? "checked" : ""}>${esc(V[id].name)}</label>`).join("")}</div><div class="statgrid" style="margin-top:15px">${companyOrder
          .filter((id) => state.selected.has(id))
          .map(
            (id) =>
              `<div class="stat"><div class="small muted">${esc(V[id].name)}</div><b>${money(V[id].total)}</b><div class="small muted">Quoted overall total where provided; otherwise item pricing only. <b>Not committee cost.</b></div></div>`,
          )
          .join(
            "",
          )}</div><div class="notice" style="margin-top:13px"><b>How to read:</b> a fee shown in several committee rows is the same shared quotation item, not a new charge. Management, equipment supply and optional items may differ in scope. An empty cell is not a zero-price offer. See the detail and clarification notes before choosing an EM.</div></section><section class="panel"><div class="tabsline"><h2>Service-by-service comparison</h2><span class="tag">${rows.length} relevant service groups</span></div><input class="input" id="search" type="search" placeholder="Search service or quoted item…" value="${esc(state.query)}" style="width:100%;margin:5px 0 14px"/><div id="tableHost">${table(rows, active)}</div></section></div></div>`;
      }
      function table(rows, active) {
        if (!active.length)
          return '<div class="notice">Select at least one company.</div>';
        if (!rows.length)
          return '<div class="notice">No matching service descriptions.</div>';
        return `<div class="tablewrap"><table class="comparison" style="min-width:${195 + active.length * 270}px"><thead><tr><th>Task / service</th>${active.map((x) => `<th>${esc(V[x].name)}<div class="small muted" style="font-weight:400;margin-top:5px">${esc(V[x].type)}</div></th>`).join("")}</tr></thead><tbody>${rows.map((r) => `<tr><td><div class="servicetitle">${esc(r.service)}</div><div class="coverage">${Object.entries(r.offers).filter(([v, ids]) => active.includes(v) && ids.some((id) => I[id] && I[id].price != null)).length} vendor(s) with a stated item price — check scope and pricing basis.</div><details class="expand"><summary>Comparison caution</summary><p class="rowwarning">${esc(r.caution)}</p></details></td>${active.map((v) => `<td>${offerCell(r.offers[v] || [], v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      }
      function catalog() {
        return `<section class="panel"><h2>Complete itemised quotations</h2><p class="small muted">Every recorded priced or optional line from all supplied 2027 supplier quotations and proposals, not solely the committee comparison groups. Use this view to inspect detail without adding repeated shared-package fees.</p><div class="controls">${companyOrder.map((v) => `<button class="btn ${state.catalog === v ? "primary" : ""}" data-catalog="${v}">${esc(V[v].name)}</button>`).join("")}</div><div class="statgrid" style="margin-top:15px;grid-template-columns:repeat(2,minmax(0,1fr))"><div class="stat"><span class="small muted">Quoted overall total</span><b>${money(V[state.catalog].total)}</b></div><div class="stat"><span class="small muted">Document</span><div style="overflow-wrap:anywhere;font-size:13px;margin-top:7px">${esc(V[state.catalog].pdf)}</div></div></div><div class="notice" style="margin-top:12px">${esc(V[state.catalog].basis)} ${esc(V[state.catalog].note)}</div>${db.items
          .filter((i) => i.vendor === state.catalog)
          .map(
            (i) =>
              `<div class="quoteitem"><div class="row"><div><b>${esc(i.name)}</b><div class="small muted" style="margin-top:4px">${esc(i.detail || "")}</div></div><div style="text-align:right;min-width:125px"><b>${money(i.price)}</b><div class="small muted">${esc(kind(i))}</div></div></div><div class="source">${esc(V[state.catalog].pdf)} · page ${esc(i.page || "?")}</div></div>`,
          )
          .join("")}</section>`;
      }
      function overview() {
        return `<div class="panel"><h2>All available company proposals</h2><p class="small muted">Totals are complete quotations as stated in the documents, but their included services differ. These figures are not comparable overall totals, and some companies submitted item rates or unpriced proposals only.</p><div class="statgrid">${companyOrder.map((v) => `<div class="stat"><h3>${esc(V[v].name)}</h3><b>${money(V[v].total)}</b><p class="small">${esc(V[v].basis)}</p><div class="source">${esc(V[v].pdf)}</div></div>`).join("")}</div><h3 style="margin-top:25px">Read this before comparing</h3><div class="notice">Dreamz’s RM30,000 conference technology bundle includes subcomponents priced RM8,000 + RM8,000 + RM6,000 + RM8,000; these are not separate additional costs. Dreamz’s RM40,000 onsite package likewise contains subcomponents. NeuDimenxion’s separate A2 registration and B1.1 conference technology scopes have related functionality but remain separately charged under its full proposal; this is a question for the vendor, not a deduction from the quotation. Apxara’s package separately prices substantial AV production and event crew. Optional add-ons are excluded from base totals.</div><p class="small muted">Source documents are named in each quotation entry; PDF files are not bundled to keep the website lightweight.</p></div>`;
      }
      function render() {
        document
          .querySelectorAll("[data-tab]")
          .forEach((b) =>
            b.classList.toggle("active", b.dataset.tab === state.tab),
          );
        document.getElementById("app").innerHTML =
          state.tab === "compare"
            ? comparison()
            : state.tab === "catalog"
              ? catalog()
              : overview();
        const mobileCommittee = document.getElementById("mobileCommittee");
        if (mobileCommittee)
          mobileCommittee.onchange = () => {
            state.committee = mobileCommittee.value;
            state.query = "";
            render();
          };
        document.querySelectorAll("[data-committee]").forEach(
          (el) =>
            (el.onclick = () => {
              state.committee = el.dataset.committee;
              state.query = "";
              render();
            }),
        );
        document.querySelectorAll("[data-company]").forEach(
          (el) =>
            (el.onchange = () => {
              el.checked
                ? state.selected.add(el.dataset.company)
                : state.selected.delete(el.dataset.company);
              render();
            }),
        );
        document.querySelectorAll("[data-catalog]").forEach(
          (el) =>
            (el.onclick = () => {
              state.catalog = el.dataset.catalog;
              render();
            }),
        );
        const reset = document.getElementById("reset");
        if (reset)
          reset.onclick = () => {
            state.selected = new Set(companyOrder);
            render();
          };
        const toggle = document.getElementById("toggleTasks");
        if (toggle)
          toggle.onclick = () => {
            state.showTasks = !state.showTasks;
            render();
          };
        const search = document.getElementById("search");
        if (search)
          search.oninput = () => {
            state.query = search.value;
            const rows = (ROWS[state.committee] || []).filter(
              (r) =>
                !state.query ||
                [
                  r.service,
                  r.caution,
                  ...Object.values(r.offers)
                    .flat()
                    .map((x) => I[x]?.name || ""),
                ]
                  .join(" ")
                  .toLowerCase()
                  .includes(state.query.toLowerCase()),
            );
            document.getElementById("tableHost").innerHTML = table(
              rows,
              companyOrder.filter((x) => state.selected.has(x)),
            );
          };
      }
      document.querySelectorAll("[data-tab]").forEach(
        (el) =>
          (el.onclick = () => {
            state.tab = el.dataset.tab;
            render();
          }),
      );
      // Read-only exports use the same current committee and selected-company filter.
      document.getElementById("printPage").onclick = () => window.print();
      function csvCell(value) {
        return '"' + String(value ?? "").replace(/"/g, '""') + '"';
      }
      document.getElementById("exportCSV").onclick = () => {
        const committee = C[state.committee];
        const rows = [
          [
            "Committee",
            "Service",
            "Company",
            "Quoted item",
            "Price (RM)",
            "Pricing basis",
            "Scope detail",
            "Source PDF",
            "Page",
            "Comparison caution",
          ],
        ];
        for (const r of ROWS[state.committee] || []) {
          for (const vendor of companyOrder.filter((x) =>
            state.selected.has(x),
          )) {
            const ids = r.offers[vendor] || [];
            if (!ids.length) {
              rows.push([
                committee.name,
                r.service,
                V[vendor].name,
                "No matching itemised offer",
                "",
                "",
                "",
                V[vendor].pdf,
                "",
                r.caution,
              ]);
              continue;
            }
            for (const id of ids) {
              const i = I[id];
              if (!i || i.vendor !== vendor) continue;
              rows.push([
                committee.name,
                r.service,
                V[vendor].name,
                i.name,
                i.price ?? "",
                kind(i),
                i.detail || "",
                V[vendor].pdf,
                i.page || "",
                r.caution,
              ]);
            }
          }
        }
        const csv =
          "\uFEFF" + rows.map((row) => row.map(csvCell).join(",")).join("\r\n");
        const url = URL.createObjectURL(
          new Blob([csv], { type: "text/csv;charset=utf-8" }),
        );
        const a = document.createElement("a");
        a.href = url;
        a.download = `FMSC_2027_${state.committee}_comparison.csv`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      };
      // Install is available only on secure origins (HTTPS or localhost).
      let installPrompt = null;
      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        installPrompt = event;
        const btn = document.getElementById("installApp");
        btn.hidden = false;
      });
      document.getElementById("installApp").onclick = async () => {
        if (!installPrompt) return;
        installPrompt.prompt();
        await installPrompt.userChoice;
        installPrompt = null;
        document.getElementById("installApp").hidden = true;
      };
      window.addEventListener("appinstalled", () => {
        document.getElementById("installApp").hidden = true;
      });
      if (
        "serviceWorker" in navigator &&
        (location.protocol === "https:" ||
          location.hostname === "localhost" ||
          location.hostname === "127.0.0.1")
      ) {
        window.addEventListener("load", () =>
          navigator.serviceWorker.register("./sw.js").catch(() => {}),
        );
      }
      render();
    </script>
  </body>
</html>
